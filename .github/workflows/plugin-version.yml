name: Plugin version bump

on:
  pull_request:
    paths:
      - "plugins/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-plugin-versions.mjs origin/${{ github.base_ref }}
